[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsearch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "numpy>=1.26,<3",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "faiss-cpu>=1.7.4",
  "pillow>=10.0",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B905", "E501"]
