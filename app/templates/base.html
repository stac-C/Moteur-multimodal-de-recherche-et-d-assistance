<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Moteur multimodal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body data-caps='{{ caps|tojson if caps is defined else "{}" }}'>
  <header class="top">
    <h1>Moteur multimodal<small><sub>texte · image · audio</sub></small></h1>
    <nav>
      <a href="{{ url_for('search.index') }}">Recherche</a>
      <a href="{{ url_for('viz.embeddings_page') }}">Embeddings</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <hr>à propos
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
